    function produkMtdCard(name, monthly, colorCls) {
      // grafik garis per produk: garis putus-putus = target bulanan, garis tegas = realisasi.
      // Label % pencapaian per bulan di atas, nilai realisasi pada tiap titik, bulan di bawah.
      const months = D.months;
      const n = months.length;
      const W = 280, H = 114, X0 = 18, X1 = 262, YT = 24, YB = 88;
      const maxV = Math.max(...monthly.target.map(v => v || 0), ...monthly.real.map(v => v || 0), 0.001);
      const xAt = i => n > 1 ? X0 + i * (X1 - X0) / (n - 1) : (W / 2);
      // nilai negatif (bulan yang didominasi koreksi) dijepit sedikit di bawah garis dasar
      const yAt = v => v >= 0 ? YB - v / maxV * (YB - YT) : Math.min(YB + 7, YB - v / maxV * (YB - YT));
      const ptT = months.map((m, i) => `${xAt(i).toFixed(1)},${yAt(monthly.target[i] || 0).toFixed(1)}`);
      const ptR = months.map((m, i) => `${xAt(i).toFixed(1)},${yAt(monthly.real[i] || 0).toFixed(1)}`);
      const area = n > 1 ? `<polygon class="anim-fade" points="${X0},${YB} ${ptR.join(' ')} ${xAt(n - 1).toFixed(1)},${YB}" fill="var(--gab)" opacity=".09"/>` : '';
      const lineT = n > 1 ? `<polyline class="anim-fade" points="${ptT.join(' ')}" fill="none" stroke="var(--dim)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".85"/>` : '';
      const lineR = n > 1 ? `<polyline class="anim-draw" points="${ptR.join(' ')}" fill="none" stroke="var(--gab)" stroke-width="2.2" stroke-linejoin="round"/>` : '';
      const marks = months.map((m, i) => {
        const t = monthly.target[i] || 0, r = monthly.real[i] || 0, mp = t ? rnd2(r / t * 100) : 0;
        const x = xAt(i), yR = yAt(r);
        const labY = yR < YT + 10 ? yR + 12 : yR - 6; // label nilai di bawah titik bila mepet atas
        return `<text x="${x}" y="12" text-anchor="middle" font-size="8" font-weight="700" fill="${pctColor(mp)}" font-family="Space Grotesk">${fmt(mp)}%</text>
          <circle cx="${x}" cy="${yAt(t).toFixed(1)}" r="1.8" fill="var(--dim)"/>
          <circle cx="${x}" cy="${yR.toFixed(1)}" r="2.6" fill="var(--gab)"/>
          <text x="${x}" y="${labY.toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="600" fill="var(--ink)">${fmt(r)}</text>
          <text x="${x}" y="${H - 4}" text-anchor="middle" font-size="8" fill="var(--faint)">${m}</text>`;
      }).join('');
      const xLast = xAt(n - 1);
      const lastT = monthly.target[n - 1] || 0, lastR = monthly.real[n - 1] || 0;
      const lastPct = lastT ? rnd2(lastR / lastT * 100) : 0;
      return `<div class="mtd-card">
      <div class="hd"><div class="nm ${colorCls}">${name}</div><div class="pc" style="color:${pctColor(lastPct)}">${fmt(lastPct)}%</div></div>
      <div class="mtd-line"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <line x1="${X0 - 6}" y1="${YB}" x2="${X1 + 6}" y2="${YB}" stroke="var(--border)" stroke-width="1"/>
        <line x1="${xLast}" y1="${YT - 6}" x2="${xLast}" y2="${YB}" stroke="var(--border2)" stroke-width="1" stroke-dasharray="2 3" opacity=".8"/>
        ${area}${lineT}${lineR}${marks}
      </svg></div>
      <div class="mtd-fig">${D.meta.latest_month}: <b>${fmt(lastR)}</b>/${fmt(lastT)} M</div>
    </div>`;
    }
    function slProdukMtd() {
      const kurCard = produkMtdCard('KUR', D.produk_kur.monthly, 'tag-kur');

    /* ---------- Kartu YoY dua-garis: tahun ini (garis tegas) vs tahun lalu (garis putus-putus) ----------
       Dipakai slide "YoY KUR per Bank" & "YoY NON KUR per Produk". Seinformatif mungkin: nilai di
       tiap titik tahun ini, garis pembanding tahun lalu, badge %YoY + nominal, dan total kedua tahun. */
    function yoyDualCard(name, cur, ly, color, yoy, yoyAbs, curTot, lyTot, tagCls) {
      const months = D.months, n = months.length;
      const W = 280, H = 122, X0 = 16, X1 = 264, YT = 26, YB = 92;
      const maxV = Math.max(...cur.map(v => v || 0), ...ly.map(v => v || 0), 0.001);
      const xAt = i => n > 1 ? X0 + i * (X1 - X0) / (n - 1) : W / 2;
      const yAt = v => YB - (Math.max(v, 0) / maxV) * (YB - YT);
      const ptsCur = cur.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v || 0).toFixed(1)}`);
      const ptsLy = ly.map((v, i) => `${xAt(i).toFixed(1)},${yAt(v || 0).toFixed(1)}`);
      const halo = cssVar('--surface', '#141E33');
      const area = n > 1 ? `<polygon class="anim-fade" points="${X0},${YB} ${ptsCur.join(' ')} ${xAt(n - 1).toFixed(1)},${YB}" fill="${color}" opacity=".09"/>` : '';
      const lineLy = n > 1 ? `<polyline class="anim-fade" points="${ptsLy.join(' ')}" fill="none" stroke="var(--faint)" stroke-width="1.7" stroke-dasharray="4 3"/>` : '';
      const lineCur = n > 1 ? `<polyline class="anim-draw" points="${ptsCur.join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round"/>` : '';
      const dotsLy = ly.map((v, i) => `<circle cx="${xAt(i).toFixed(1)}" cy="${yAt(v || 0).toFixed(1)}" r="1.6" fill="var(--faint)"/>`).join('');
      const marks = months.map((m, i) => {
        const yv = yAt(cur[i] || 0), labY = yv < YT + 9 ? yv + 11 : yv - 6;
        return `<circle cx="${xAt(i).toFixed(1)}" cy="${yv.toFixed(1)}" r="2.5" fill="${color}"/>
          <text x="${xAt(i).toFixed(1)}" y="${labY.toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${color}" paint-order="stroke" stroke="${halo}" stroke-width="2.4">${fmt(cur[i] || 0)}</text>
          <text x="${xAt(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="8" fill="var(--faint)">${m}</text>`;
      }).join('');
      return `<div class="mtd-card">
      <div class="hd"><div class="nm ${tagCls || ''}">${name}</div><div class="pc">${yoyBadge(yoy, yoyAbs) || '<span style=\"color:var(--faint);font-size:11px\">—</span>'}</div></div>
      <div class="mtd-line"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <line x1="${X0 - 6}" y1="${YB}" x2="${X1 + 6}" y2="${YB}" stroke="var(--border)" stroke-width="1"/>
        ${area}${lineLy}${lineCur}${dotsLy}${marks}
      </svg></div>
      <div class="mtd-fig">2026: <b>${fmt(curTot)}</b> M &middot; 2025: ${fmt(lyTot)} M</div>
    </div>`;
    }

      <span><span style="display:inline-block;width:18px;border-top:2.5px solid var(--ink);margin-right:6px;vertical-align:middle"></span>2026 (tahun berjalan) · angka pada titik = realisasi (M)</span>

    /* ---------- Zoom & pan peta geografis (manipulasi viewBox SVG) ----------

    const GEO_W = 740, GEO_H = 452, GEO_MAXZOOM = 9;
    let geoVB = null;
    function geoViewBox() {
      if (!geoVB) geoVB = { x: 0, y: 0, w: GEO_W, h: GEO_H };
      return `${geoVB.x} ${geoVB.y} ${geoVB.w} ${geoVB.h}`;
    }
    function geoSvgEl() { return document.getElementById('geoSvg'); }
    function geoClamp() {
      const minW = GEO_W / GEO_MAXZOOM, minH = GEO_H / GEO_MAXZOOM;
      if (geoVB.w > GEO_W) geoVB.w = GEO_W; if (geoVB.w < minW) geoVB.w = minW;
      if (geoVB.h > GEO_H) geoVB.h = GEO_H; if (geoVB.h < minH) geoVB.h = minH;
      if (geoVB.x < 0) geoVB.x = 0; if (geoVB.y < 0) geoVB.y = 0;
      if (geoVB.x + geoVB.w > GEO_W) geoVB.x = GEO_W - geoVB.w;
      if (geoVB.y + geoVB.h > GEO_H) geoVB.y = GEO_H - geoVB.h;
    }
    function geoApply() { const s = geoSvgEl(); if (s) s.setAttribute('viewBox', geoViewBox()); }
    function geoPt(evt) { // koordinat kursor -> koordinat user SVG (akurat, memakai CTM)
      const s = geoSvgEl(); if (!s || !s.getScreenCTM) return null;
      const p = s.createSVGPoint(); p.x = evt.clientX; p.y = evt.clientY;
      const m = s.getScreenCTM(); if (!m) return null;
      return p.matrixTransform(m.inverse());
    }
    function geoWheel(evt) {
      evt.preventDefault(); if (!geoVB) geoViewBox();
      const pt = geoPt(evt) || { x: geoVB.x + geoVB.w / 2, y: geoVB.y + geoVB.h / 2 };
      const f = evt.deltaY < 0 ? 0.82 : 1 / 0.82; // scroll atas = perbesar
      let nw = geoVB.w * f, nh = geoVB.h * f;
      const minW = GEO_W / GEO_MAXZOOM, minH = GEO_H / GEO_MAXZOOM;
      nw = Math.min(GEO_W, Math.max(minW, nw)); nh = Math.min(GEO_H, Math.max(minH, nh));
      geoVB.x = pt.x - (pt.x - geoVB.x) * (nw / geoVB.w);
      geoVB.y = pt.y - (pt.y - geoVB.y) * (nh / geoVB.h);
      geoVB.w = nw; geoVB.h = nh; geoClamp(); geoApply();
    }
    let geoDrag = null;
    function geoDown(evt) { if (!geoVB) geoViewBox(); geoDrag = { cx: evt.clientX, cy: evt.clientY, vx: geoVB.x, vy: geoVB.y }; const s = geoSvgEl(); if (s) s.style.cursor = 'grabbing'; }
    function geoMove(evt) {
      if (!geoDrag) return; const s = geoSvgEl(); if (!s) return;
      const rect = s.getBoundingClientRect();
      geoVB.x = geoDrag.vx - (evt.clientX - geoDrag.cx) * (geoVB.w / rect.width);
      geoVB.y = geoDrag.vy - (evt.clientY - geoDrag.cy) * (geoVB.h / rect.height);
      geoClamp(); geoApply();
    }
    function geoUp() { geoDrag = null; const s = geoSvgEl(); if (s) s.style.cursor = 'grab'; }
    function geoZoomBtn(f) {
      if (!geoVB) geoViewBox();
      const cx = geoVB.x + geoVB.w / 2, cy = geoVB.y + geoVB.h / 2;
      const minW = GEO_W / GEO_MAXZOOM, minH = GEO_H / GEO_MAXZOOM;
      let nw = Math.min(GEO_W, Math.max(minW, geoVB.w * f)), nh = Math.min(GEO_H, Math.max(minH, geoVB.h * f));
      geoVB.x = cx - nw / 2; geoVB.y = cy - nh / 2; geoVB.w = nw; geoVB.h = nh; geoClamp(); geoApply();
    }
    function geoReset() { geoVB = { x: 0, y: 0, w: GEO_W, h: GEO_H }; geoApply(); }

    /* ---------- Slide MONITORING akses pengguna (peran Nasional/Regional) ----------

    function slMonitoring() {

        : ('Lingkup: unit ' + (me.unit || '') + ' & Branch Office binaannya');

    function slGeoDetail() {
      const sortedRo = [...D.ro].sort((a, b) => b.pct - a.pct);
      const groups = sortedRo.map(geoDetailGroup).join('');
      return `<div class="slide" data-name="Detail per Cabang">
    <div class="eyebrow"><span class="num">13</span><span class="lbl">Detail per Cabang</span></div>
    <h2>Rincian Target &amp; Pencapaian per Branch Office · per Regional Office</h2>
    <div class="desc">Seluruh ${D.meta.n_bo} Branch Office (termasuk Main Branch Office/KC Utama) dikelompokkan per Regional Office. Blok kiri: <b>MtD bulan ${D.meta.latest_month}</b> (Realisasi/Target + %capai) untuk KUR, NON KUR, dan Gabungan. Blok kanan (tetap): Realisasi/Target <b>seasonal</b>, %capai seasonal, serta <b>Fullyear (FY)</b> &amp; <b>YoY</b>. Angka dalam Milyar. Geser untuk melihat semua RO.</div>

  </div>`;
    }

    /* ---------- compute D from an uploaded workbook (mirrors baseline logic) ---------- */
    const MONTH_FULL = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const MONTH_SH = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const NONKUR = ['AKK', 'AKM', 'KBG', 'PEN', 'LC_SKBDN', 'SC_CB', 'ASKREDAG'];
    const PNAME = { AKK: 'AKK', AKM: 'AKM', KBG: 'KBG', PEN: 'PEN', LC_SKBDN: 'LC/SKBDN', SC_CB: 'SC/CB', ASKREDAG: 'ASKREDAG' };
    const BANKNAME = { KUR_BRI: 'BRI', KUR_BNI: 'BNI', KUR_BTN: 'BTN', KUR_MANDIRI: 'Mandiri', KUR_BPD: 'BPD', KUR_SWASTA: 'Swasta' };
    const isKur = c => c === 'KUR' || ('' + c).startsWith('KUR_');
    const catOf = c => isKur(c) ? 'KUR' : (NONKUR.includes(c) ? 'NONKUR' : 'X');

    function computeD(tRows, rRows, cRows, cutoff, lyRows, bankRows, bankLyRows, visitRows, angRows) {
      const B = 1e9, rnd = (x, n = 1) => +x.toFixed(n);
      const bo2ro = {}, roName = {}, boName = {};
      cRows.forEach(r => { bo2ro[r.BO_Code] = r.RO_Code; roName[r.RO_Code] = r.RO_Name; boName[r.BO_Code] = r.BO_Name; });
      const T = tRows.map(r => ({ bo: r.BO_Code, pc: r.Produk_Code, m: +r.Bulan, cat: catOf(r.Produk_Code), v: +r.Target_Rupiah || 0 }));
      const R = rRows.map(r => ({ bo: r.BO_Code, pc: r.Produk_Code, m: +r.Bulan, cat: catOf(r.Produk_Code), v: +r.Realisasi_Rupiah || 0 }));
      const maxLatest = Math.max(...R.map(r => r.m).filter(x => x >= 1 && x <= 12));
      const latest = (cutoff && cutoff >= 1 && cutoff <= maxLatest) ? cutoff : maxLatest;
      const ytdM = Array.from({ length: latest }, (_, i) => i + 1), allM = Array.from({ length: 12 }, (_, i) => i + 1);
      const sumT = (mo, cat, bo) => T.reduce((a, r) => a + ((mo.includes(r.m) && (!cat || cat.includes(r.cat)) && (!bo || bo.includes(r.bo))) ? r.v : 0), 0);
      const sumR = (mo, cat, bo) => R.reduce((a, r) => a + ((mo.includes(r.m) && (!cat || cat.includes(r.cat)) && (!bo || bo.includes(r.bo))) ? r.v : 0), 0);
      // ---- YoY: optional "Fact_Realisasi_LY" sheet (same columns as Fact_Realisasi, prior year) ----
      const RLY = (lyRows || []).map(r => ({ bo: r.BO_Code, pc: r.Produk_Code, m: +r.Bulan, cat: catOf(r.Produk_Code), v: +r.Realisasi_Rupiah || 0 }));
      const hasLY = RLY.length > 0;
      const sumRLY = (mo, cat, bo) => RLY.reduce((a, r) => a + ((mo.includes(r.m) && (!cat || cat.includes(r.cat)) && (!bo || bo.includes(r.bo))) ? r.v : 0), 0);
      const yoyPct = (currRaw, prevRaw) => (hasLY && prevRaw) ? rnd((currRaw - prevRaw) / prevRaw * 100, 1) : null;
      // perubahan NOMINAL YoY (dalam Milyar), dengan syarat sama seperti yoyPct (agar % dan nominal muncul berbarengan)
      const yoyAbs = (currRaw, prevRaw) => (hasLY && prevRaw) ? rnd((currRaw - prevRaw) / B, 2) : null;
      const blk = (tm, rm) => { const o = {};[['kur', ['KUR']], ['nonkur', ['NONKUR']], ['gab', ['KUR', 'NONKUR']]].forEach(([k, c]) => { const t = sumT(tm, c), rr = sumR(rm, c), rrLY = sumRLY(rm, c); o[k] = { target: rnd(t / B, 2), real: rnd(rr / B, 2), ly_real: rnd(rrLY / B, 2), pct: t ? rnd(rr / t * 100) : 0, yoy: yoyPct(rr, rrLY), yoy_abs: yoyAbs(rr, rrLY) }; }); return o; };
      const nd = {};
      nd.ytd = blk(allM, ytdM); nd.mtd = blk([latest], [latest]); nd.seasonal = blk(ytdM, ytdM);
      // MtD (bulan berjalan saja) per unit — dipakai slide "Detail per Cabang" (KUR/NON KUR/Gabungan)
      const mtdBlk = boList => {
        const o = {};
        [['kur', ['KUR']], ['nonkur', ['NONKUR']], ['gab', ['KUR', 'NONKUR']]].forEach(function (pair) {
          const k = pair[0], c = pair[1];
          const t = sumT([latest], c, boList), rr = sumR([latest], c, boList);
          o[k] = { real: rnd(rr / B, 2), target: rnd(t / B, 2), pct: t ? rnd(rr / t * 100) : 0 };
        });
        return o;
      };
      // RO — includes Main Branch Office/KC Utama as its own RO (8 total); "KP" (Kantor Pusat) is
      // head-office overhead with no target of its own (its realisasi still counts in company-wide
      // totals above, it's just not a rankable region), so it's excluded here like a blank code.
      const ros = [...new Set(cRows.map(r => r.RO_Code))].filter(x => x && x !== 'KP');
      nd.ro = ros.map(ro => {
        const bos = cRows.filter(r => r.RO_Code === ro).map(r => r.BO_Code);
        const t = sumT(ytdM, null, bos), rr = sumR(ytdM, null, bos);
        const kurTAnnual = sumT(allM, ['KUR'], bos), nonkurTAnnual = sumT(allM, ['NONKUR'], bos);
        return {
          code: ro, name: (roName[ro] || ro).replace('Regional Office ', 'RO '), target: rnd(t / B), real: rnd(rr / B), pct: t ? rnd(rr / t * 100) : 0,
          kur_t: rnd(sumT(ytdM, ['KUR'], bos) / B), kur_r: rnd(sumR(ytdM, ['KUR'], bos) / B),
          nonkur_t: rnd(sumT(ytdM, ['NONKUR'], bos) / B), nonkur_r: rnd(sumR(ytdM, ['NONKUR'], bos) / B),
          // % per kategori dihitung dari sumber MENTAH (bukan angka Milyar yang sudah dibulatkan)
          // agar konsisten dengan % Gabungan — mis. unit tanpa KUR: % Gabungan = % NON KUR persis.
          kur_pct: sumT(ytdM, ['KUR'], bos) ? rnd(sumR(ytdM, ['KUR'], bos) / sumT(ytdM, ['KUR'], bos) * 100) : 0,
          nonkur_pct: sumT(ytdM, ['NONKUR'], bos) ? rnd(sumR(ytdM, ['NONKUR'], bos) / sumT(ytdM, ['NONKUR'], bos) * 100) : 0,
          target_annual: rnd((kurTAnnual + nonkurTAnnual) / B), kur_t_annual: rnd(kurTAnnual / B), nonkur_t_annual: rnd(nonkurTAnnual / B),
          mtd: mtdBlk(bos),
          // combined (gab) YoY plus its KUR-only/NON KUR-only breakdowns, since the RO ranking
          // slide lets the viewer switch tabs between KUR/NON KUR/Gabungan — each tab must show
          // its own YoY, not the blended figure (the two can move in very different directions).
          yoy: yoyPct(rr, sumRLY(ytdM, null, bos)), yoy_abs: yoyAbs(rr, sumRLY(ytdM, null, bos)),
          kur_yoy: yoyPct(sumR(ytdM, ['KUR'], bos), sumRLY(ytdM, ['KUR'], bos)), kur_yoy_abs: yoyAbs(sumR(ytdM, ['KUR'], bos), sumRLY(ytdM, ['KUR'], bos)),
          nonkur_yoy: yoyPct(sumR(ytdM, ['NONKUR'], bos), sumRLY(ytdM, ['NONKUR'], bos)), nonkur_yoy_abs: yoyAbs(sumR(ytdM, ['NONKUR'], bos), sumRLY(ytdM, ['NONKUR'], bos))
        };
      }).sort((a, b) => b.pct - a.pct);
      // BO (each branch, with KUR/NON KUR split for the 3-category ranking)
      const bos = [...new Set(cRows.map(r => r.BO_Code))].filter(b => b && b !== 'KP001' && b !== 'RO0001');
      nd.bo = bos.map(bo => {
        const t = sumT(ytdM, null, [bo]), rr = sumR(ytdM, null, [bo]);
        const kt = sumT(ytdM, ['KUR'], [bo]), kr = sumR(ytdM, ['KUR'], [bo]);
        const nt = sumT(ytdM, ['NONKUR'], [bo]), nr = sumR(ytdM, ['NONKUR'], [bo]);
        const ktAnnual = sumT(allM, ['KUR'], [bo]), ntAnnual = sumT(allM, ['NONKUR'], [bo]);
        return {
          code: bo, name: boName[bo] || bo, ro: (roName[bo2ro[bo]] || '').replace('Regional Office ', 'RO '),
          target: rnd(t / B, 2), real: rnd(rr / B, 2), pct: t ? rnd(rr / t * 100) : 0,
          kur_t: rnd(kt / B, 2), kur_r: rnd(kr / B, 2), nonkur_t: rnd(nt / B, 2), nonkur_r: rnd(nr / B, 2), t_: t, r_: rr,
          kur_pct: kt ? rnd(kr / kt * 100) : 0, nonkur_pct: nt ? rnd(nr / nt * 100) : 0,   // % dari sumber mentah (konsisten dgn Gabungan)
          target_annual: rnd((ktAnnual + ntAnnual) / B, 2), kur_t_annual: rnd(ktAnnual / B, 2), nonkur_t_annual: rnd(ntAnnual / B, 2),
          mtd: mtdBlk([bo]),
          // same combined + per-category YoY split as RO, for the same reason (KUR/NON KUR/Gabungan tabs)
          yoy: yoyPct(rr, sumRLY(ytdM, null, [bo])), yoy_abs: yoyAbs(rr, sumRLY(ytdM, null, [bo])),
          kur_yoy: yoyPct(kr, sumRLY(ytdM, ['KUR'], [bo])), kur_yoy_abs: yoyAbs(kr, sumRLY(ytdM, ['KUR'], [bo])),
          nonkur_yoy: yoyPct(nr, sumRLY(ytdM, ['NONKUR'], [bo])), nonkur_yoy_abs: yoyAbs(nr, sumRLY(ytdM, ['NONKUR'], [bo]))
        };
      }).filter(b => b.t_ || b.r_).sort((a, b) => b.pct - a.pct);
      // produk (with per-month breakdown Jan..latest, for the MtD-per-produk slide)
      nd.produk_nonkur = NONKUR.map(p => {
        const tt = T.reduce((a, r) => a + ((r.pc === p && ytdM.includes(r.m)) ? r.v : 0), 0);
        const rr = R.reduce((a, r) => a + ((r.pc === p && ytdM.includes(r.m)) ? r.v : 0), 0);
        const rrLY = RLY.reduce((a, r) => a + ((r.pc === p && ytdM.includes(r.m)) ? r.v : 0), 0);
        const ttAnnual = T.reduce((a, r) => a + ((r.pc === p && allM.includes(r.m)) ? r.v : 0), 0);
        const monthlyTarget = ytdM.map(m => rnd(T.reduce((a, r) => a + ((r.pc === p && r.m === m) ? r.v : 0), 0) / B, 2));
        const monthlyReal = ytdM.map(m => rnd(R.reduce((a, r) => a + ((r.pc === p && r.m === m) ? r.v : 0), 0) / B, 2));
        // realisasi bulanan TAHUN LALU per produk (untuk slide YoY NON KUR per produk)
        const monthlyRealLY = ytdM.map(m => rnd(RLY.reduce((a, r) => a + ((r.pc === p && r.m === m) ? r.v : 0), 0) / B, 2));
        return {
          name: PNAME[p], target: rnd(tt / B, 2), real: rnd(rr / B, 2), pct: tt ? rnd(rr / tt * 100) : 0,
          target_annual: rnd(ttAnnual / B, 2), pct_annual: ttAnnual ? rnd(rr / ttAnnual * 100) : 0,
          yoy: yoyPct(rr, rrLY), yoy_abs: yoyAbs(rr, rrLY),
          ly_real: rnd(rrLY / B, 2), ly_monthly: monthlyRealLY,
          monthly: { target: monthlyTarget, real: monthlyReal }
        };
      }).sort((a, b) => b.real - a.real);
      const tk = sumT(ytdM, ['KUR']), rk = sumR(ytdM, ['KUR']), tkAnnual = sumT(allM, ['KUR']);
      const kurMonthlyTarget = ytdM.map(m => rnd(sumT([m], ['KUR'], null) / B, 2));
      const kurMonthlyReal = ytdM.map(m => rnd(sumR([m], ['KUR'], null) / B, 2));
      nd.produk_kur = {
        // 2 desimal (bukan 1) agar konsisten dengan produk_nonkur dan blok ytd/seasonal —
        // pembulatan 1 desimal membuat 1700.47 tersimpan 1700.5 lalu tampil "1701 M" di slide
        // produk, padahal slide YtD menampilkan "1700 M" untuk target tahunan yang sama.
        target: rnd(tk / B, 2), real: rnd(rk / B, 2), pct: tk ? rnd(rk / tk * 100) : 0,
        target_annual: rnd(tkAnnual / B, 2), pct_annual: tkAnnual ? rnd(rk / tkAnnual * 100) : 0,
        yoy: yoyPct(rk, sumRLY(ytdM, ['KUR'])), yoy_abs: yoyAbs(rk, sumRLY(ytdM, ['KUR'])),
        monthly: { target: kurMonthlyTarget, real: kurMonthlyReal }
      };
      // per-bank KUR realisasi — prefer the dedicated "Fact_KUR_Bank" sheet (same row shape as
      // Fact_Realisasi: BO_Code, Produk_Code [KUR_BRI/KUR_BNI/KUR_BTN/KUR_MANDIRI/KUR_BPD/KUR_SWASTA],
      // Bulan, Realisasi_Rupiah — just kept in its own tab since it comes from a different source
      // system). Falls back to KUR_<bank> rows mixed into the main Fact_Realisasi sheet if no
      // dedicated sheet is provided. Nominal amounts are shown RAW, exactly as they appear in the
      // source sheet (no rescaling to the accounting KUR total) — per user requirement, the
      // per-bank figures must match the file's rincian angka-per-angka (e.g. BRI = 207M). Any
      // small month-level difference vs the accounting KUR series is a property of the source
      // data itself, not something the dashboard should silently redistribute.
      const bankEntries = (bankRows && bankRows.length)
        ? bankRows.map(r => ({ bo: r.BO_Code, pc: r.Produk_Code, m: +r.Bulan, v: +r.Realisasi_Rupiah || 0 }))
        : R.filter(r => ('' + r.pc).startsWith('KUR_'));   // .bo sudah ada di R (untuk filter per unit)
      const bankRaw = {};
      bankEntries.forEach(r => { if (('' + r.pc).startsWith('KUR_') && ytdM.includes(r.m)) bankRaw[r.pc] = (bankRaw[r.pc] || 0) + r.v; });
      const bankTotalRaw = Object.values(bankRaw).reduce((a, b) => a + b, 0);
      // realisasi per bank TAHUN LALU (sheet "Fact_KUR_Bank_LY", struktur sama) untuk slide YoY per bank
      const bankLyEntries = (bankLyRows && bankLyRows.length)
        ? bankLyRows.map(r => ({ pc: r.Produk_Code, m: +r.Bulan, v: +r.Realisasi_Rupiah || 0 })) : [];
      const bankLyTot = bc => bankLyEntries.reduce((a, r) => a + ((r.pc === bc && ytdM.includes(r.m)) ? r.v : 0), 0);
      // TARGET per bank (KUR) dari sheet Fact_Target (baris Produk_Code = KUR_BRI/KUR_BNI/… ).
      // Seasonal = jumlah Jan..bulan berjalan; FY = jumlah 12 bulan. Ada hanya bila sheet sudah
      // dipecah per bank; bila masih agregat 'KUR' saja, semua nol -> has_bank_target = false.
      const bankTgtRaw = (bc, mo) => T.reduce((a, r) => a + ((r.pc === bc && mo.includes(r.m)) ? r.v : 0), 0);
      nd.has_bank_target = T.some(r => ('' + r.pc).startsWith('KUR_'));
      nd.produk_kur_banks = Object.keys(bankRaw).map(bc => {
        // tren bulanan per bank (Jan..bulan terakhir), mentah dari sheet
        const monthly = ytdM.map(m => rnd(bankEntries.reduce((a, r) => a + ((r.pc === bc && r.m === m) ? r.v : 0), 0) / B, 2));
        const ly_monthly = ytdM.map(m => rnd(bankLyEntries.reduce((a, r) => a + ((r.pc === bc && r.m === m) ? r.v : 0), 0) / B, 2));
        const lyTot = bankLyTot(bc);
        const tSeasRaw = bankTgtRaw(bc, ytdM), tFyRaw = bankTgtRaw(bc, allM);
        return {
          name: BANKNAME[bc] || bc.replace('KUR_', ''),
          real: rnd(bankRaw[bc] / B, 2),
          pct: bankTotalRaw ? rnd(bankRaw[bc] / bankTotalRaw * 100) : 0,
          // target & pencapaian per bank (realisasi Fact_KUR_Bank vs target Fact_Target per bank)
          target: rnd(tSeasRaw / B, 2), target_annual: rnd(tFyRaw / B, 2),
          pct_seasonal: tSeasRaw ? rnd(bankRaw[bc] / tSeasRaw * 100) : 0,
          pct_annual: tFyRaw ? rnd(bankRaw[bc] / tFyRaw * 100) : 0,
          monthly,
          ly_real: rnd(lyTot / B, 2), ly_monthly,
          yoy: yoyPct(bankRaw[bc], lyTot), yoy_abs: yoyAbs(bankRaw[bc], lyTot)
        };
      }).sort((a, b) => b.real - a.real);
      nd.has_bank_ly = bankLyEntries.length > 0;
      // geo — target here MUST be the seasonal (elapsed-months) target, not the full-year target:
      // the map's bubble color encodes "tingkat pencapaian" (achievement level, ≥100%/80-99%/<80%),
      // which is only a meaningful apples-to-apples comparison against realisasi-to-date if the
      // target is scoped to the same Jan..latest window (matching how RO/BO seasonal pct works
      // everywhere else in the dashboard). Using the full annual target here would make nearly
      // every branch read as "underperforming" for most of the year purely because only part of
      // the annual target has elapsed, regardless of actual pace.
      nd.geo = cRows.filter(r => r.BO_Code !== 'KP001').map(r => {
        const bo = r.BO_Code;
        const tk = sumT(ytdM, ['KUR'], [bo]), rk = sumR(ytdM, ['KUR'], [bo]), tn = sumT(ytdM, ['NONKUR'], [bo]), rn = sumR(ytdM, ['NONKUR'], [bo]);
        if (!tk && !tn && !rk && !rn) return null;
        return {
          name: boName[bo] || bo, ro: (roName[r.RO_Code] || '').replace('Regional Office ', 'RO '),
          lat: +(+r.Latitude).toFixed(4), lng: +(+r.Longitude).toFixed(4),
          kur_t: rnd(tk / B), kur_r: rnd(rk / B), nonkur_t: rnd(tn / B), nonkur_r: rnd(rn / B), pct: (tk + tn) ? rnd((rk + rn) / (tk + tn) * 100) : 0
        };
      }).filter(Boolean);
      // ---- Progress Kunjungan BO (sheet "Fact_Kinerja_Cabang": BO_Code, Bulan, Target_Kunjungan, Realisasi_Kunjungan) ----
      // Dikelompokkan per RO -> per BO. Bila baris berbulan, hanya hitung s.d. bulan berjalan;
      // bila Bulan kosong (data tahunan per BO), semua dihitung.
      const visitByBo = {};
      (visitRows || []).forEach(r => {

    async function miniParseXlsx(buf) {

          if (e === 'amp') return '&'; if (e === 'lt') return '<'; if (e === 'gt') return '>';

          // trimRef: clamp the sheet's "!ref" range to the cells that actually hold values.
          // Excel files edited over time often carry a bloated dimension record (e.g. a single
          // style-only stub cell parked at row 1.048.576 makes the stored range "A1:H1048576").
          // sheet_to_json honors that range, so with { defval: 0 } it would iterate a MILLION
          // rows and allocate a zero-filled object for each — freezing or crashing the tab the
          // moment the file is loaded ("Muat Excel" appears to hang / errors out). Style-only
          // stub cells carry no value, so clamping to the max row/col that has a real value is
          // always safe and reduces the scan to the true data extent.
          const trimRef = s => {
            try {
              if (!s || !s['!ref']) return s;
              const rng = XLSX.utils.decode_range(s['!ref']);
              let maxR = -1, maxC = -1;
              Object.keys(s).forEach(k => {
                if (k.charCodeAt(0) === 33) return; // internal keys start with '!'

                if (!cell || cell.v === undefined || cell.v === null || cell.v === '') return;

                if (a.c > maxC) maxC = a.c;

    /* ================= Slide KINERJA UNIT (role-based: RO/BO) =================

    const UBANK_COLORS = ['#2DD4BF', '#F5B642', '#60A5FA', '#F472B6', '#34D399', '#94A3B8'];
    const UPROD_COLORS = ['#A78BFA', '#38BDF8', '#FBBF24', '#F472B6', '#34D399', '#22D3EE', '#94A3B8'];
    const escU = x => String(x == null ? '' : x).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    // donat kecil (cincin warna + angka putih), memakai kelas animasi yang sama dgn donut utama
    function donutU(pct, size, color) {
      const sw = 7, r = size / 2 - sw, c = 2 * Math.PI * r, off = c * (1 - Math.min(pct, 100) / 100);
      const pf = Math.round(size * 0.3);
      return `<div class="donut uk-don" style="width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}">
          <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--bg2)" stroke-width="${sw}"/>

    // grafik garis: SOLID (beda warna), ANGKA tiap bulan DI DALAM chart di tiap titik (anti-tabrakan)
    function ukLine(series, colors, months) {
      const W = 560, H = 200, pl = 26, pr = 14, pt = 14, pb = 20, iw = W - pl - pr, ih = H - pt - pb;
      const halo = cssVar('--surface', '#141E33');
      const max = Math.max(1, ...series.flatMap(s => s.monthly)); const nice = max * 1.2 || 1;
      const x = i => months.length <= 1 ? pl + iw / 2 : pl + iw * i / (months.length - 1);
      const y = v => pt + ih * (1 - Math.max(v, 0) / nice);
      const fmtL = v => v >= 10 ? Math.round(v).toString() : v.toFixed(1);
      let g = '';
      [0, .5, 1].forEach(function (f) { const yy = pt + ih * f; g += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${pl + iw}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-dasharray="2 3" opacity=".5"/><text x="${pl - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="var(--faint)">${(nice * (1 - f)).toFixed(0)}</text>`; });
      months.forEach(function (m, i) { g += `<text x="${x(i).toFixed(1)}" y="${(pt + ih + 13).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--faint)">${m}</text>`; });
      series.forEach(function (s, si) {
        const col = colors[si % colors.length];
        const pts = s.monthly.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
        if (months.length > 1) g += `<polyline class="anim-draw" points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>`;
        s.monthly.forEach(function (v, i) { if (v > 0) g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${col}"/>`; });
      });
      months.forEach(function (m, i) {
        let items = series.map((s, si) => ({ v: s.monthly[i], color: colors[si % colors.length] }))
          .filter(it => it.v >= 0.05).map(it => ({ v: it.v, color: it.color, yy: y(it.v) - 6 })).sort((a, b) => a.yy - b.yy);
        for (let k = 1; k < items.length; k++) { if (items[k].yy - items[k - 1].yy < 8.6) items[k].yy = items[k - 1].yy + 8.6; }
        const bottom = pt + ih - 1, over = items.length ? items[items.length - 1].yy - bottom : 0;
        if (over > 0) items.forEach(it => { it.yy -= over; });
        const anchor = i === 0 ? 'start' : (i === months.length - 1 ? 'end' : 'middle');
        const ax = i === 0 ? x(i) + 1 : (i === months.length - 1 ? x(i) - 1 : x(i));
        items.forEach(function (it) { g += `<text x="${ax.toFixed(1)}" y="${Math.max(pt + 6, it.yy).toFixed(1)}" text-anchor="${anchor}" font-size="8.5" font-weight="700" fill="${it.color}" paint-order="stroke" stroke="${halo}" stroke-width="2.6">${fmtL(it.v)}</text>`; });
      });
      return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
    }
    function ukLegend(series, colors) {
      return series.map(function (s, si) {

      }).join('');

    function ukScope(tgt, pct, show) {

        try { unitSlidesFor(authUser.role, authUser.unit).forEach(unit => slides.push(slKinerjaUnit(unit))); } catch (e) { }
      }
      // slide MONITORING (paling akhir) — hanya untuk peran yang berhak (Nasional/Regional); data sudah difilter server
      if (authOn() && MON && MON.ok) slides.push(slMonitoring());
      document.getElementById('slides').innerHTML = slides.join('');
      slideEls = [...document.querySelectorAll('.slide')];
      // nomor urut eyebrow otomatis mengikuti posisi slide (00, 01, 02, ...), agar tidak perlu
      // penomoran manual tiap kali slide disisipkan / dipindah.
      slideEls.forEach((s, i) => { const nEl = s.querySelector('.eyebrow .num'); if (nEl) nEl.textContent = String(i).padStart(2, '0'); });
      dotsWrap.innerHTML = '';
      slideEls.forEach((s, i) => {
        const dot = document.createElement('div'); dot.className = 'dot';
        dot.innerHTML = `<span class="tip">${s.dataset.name}</span>`; dot.onclick = () => go(i); dotsWrap.appendChild(dot);
      });
      dots = [...document.querySelectorAll('.dot')];
      document.getElementById('brandTitle').textContent = 'Pencapaian Kinerja Subrogasi s.d ' + D.meta.latest_month + ' ' + D.meta.year;
      const periodSel = document.getElementById('periodSel');
      periodSel.innerHTML = PERIODS.map((p, i) => `<option value="${i}">${p.label}</option>`).join('');
      periodSel.value = D.meta.latest_month_num ? (PERIODS.findIndex(p => (p.month || (p.data && p.data.meta.latest_month_num)) === D.meta.latest_month_num)) : PERIODS.length - 1;
      if (+periodSel.value < 0) periodSel.value = PERIODS.length - 1;
      render();
    }
    // ---- animasi masuk slide (gaya "soft" Canva): donut tumbuh, cincin terisi 0→penuh, angka menghitung naik ----
    const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    function countUp(el, target, dur, delay) {
      if (!el) return;
      if (REDUCE_MOTION) { el.textContent = fmt(target); return; }
      let t0 = null; delay = delay || 0;
      function step(now) {
        if (t0 === null) t0 = now;
        let t = (now - t0 - delay) / dur;
        if (t < 0) { el.textContent = fmt(0); requestAnimationFrame(step); return; }
        if (t > 1) t = 1;
        const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
        el.textContent = fmt(target * e);
        if (t < 1) requestAnimationFrame(step); else el.textContent = fmt(target);
      }
      requestAnimationFrame(step);
    }
    function animateReveal(slideEl) {
      if (!slideEl) return;
      if (REDUCE_MOTION) {
        slideEl.querySelectorAll('.donut-ring').forEach(r => { r.style.strokeDashoffset = r.getAttribute('data-off'); });
        slideEl.querySelectorAll('.pct[data-target]').forEach(el => { const pv = el.querySelector('.pv'); if (pv) pv.textContent = fmt(parseFloat(el.getAttribute('data-target')) || 0); });
        slideEl.querySelectorAll('.anim-draw').forEach(ln => { ln.style.strokeDasharray = ''; ln.style.strokeDashoffset = ''; });
        slideEl.querySelectorAll('.anim-fade').forEach(el => { el.style.opacity = el.getAttribute('opacity') || ''; });
        slideEl.querySelectorAll('.anim-row').forEach(r => { r.style.opacity = ''; r.style.transform = ''; });
        return;
      }
      slideEl.querySelectorAll('.donut').forEach((dn, k) => {
        const delay = Math.min(k * 55, 260);
        dn.style.transition = 'none'; dn.style.transform = 'scale(.9)'; dn.style.opacity = '0';
        void dn.getBoundingClientRect();
        dn.style.transition = `transform .6s cubic-bezier(.22,.61,.36,1) ${delay}ms, opacity .5s ease ${delay}ms`;
        dn.style.transform = 'scale(1)'; dn.style.opacity = '1';
      });
      slideEl.querySelectorAll('.donut-ring').forEach((ring, k) => {
        const off = ring.getAttribute('data-off'), circ = ring.getAttribute('data-circ');
        const delay = Math.min(k * 55, 260);
        ring.style.transition = 'none'; ring.style.strokeDashoffset = circ;
        void ring.getBoundingClientRect();
        ring.style.transition = `stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1) ${delay}ms`;
        ring.style.strokeDashoffset = off;
      });
      slideEl.querySelectorAll('.pct[data-target]').forEach((el, k) => {
        const target = parseFloat(el.getAttribute('data-target')) || 0;
        countUp(el.querySelector('.pv'), target, 1050, Math.min(k * 55, 260));
      });
      // ---- garis grafik "menggambar" mengikuti trennya (stroke-dashoffset dari penuh → 0) ----
      slideEl.querySelectorAll('.anim-draw').forEach((ln, k) => {
        let len = 0; try { len = ln.getTotalLength(); } catch (e) { len = 0; }
        if (!len) { ln.style.opacity = ''; return; }
        const delay = Math.min(k * 45, 300);
        ln.style.transition = 'none';
        ln.style.strokeDasharray = len.toFixed(1) + ' ' + len.toFixed(1);
        ln.style.strokeDashoffset = len.toFixed(1);
        void ln.getBoundingClientRect();
        ln.style.transition = `stroke-dashoffset 1s cubic-bezier(.33,0,.2,1) ${delay}ms`;
        ln.style.strokeDashoffset = '0';
      });
      // ---- area/garis pembanding/titik: fade masuk lembut selagi garis utama menggambar ----
      slideEl.querySelectorAll('.anim-fade').forEach((el, k) => {
        const target = el.getAttribute('opacity') || '1';
        const delay = Math.min(k * 30, 260);
        el.style.transition = 'none'; el.style.opacity = '0';
        void el.getBoundingClientRect();
        el.style.transition = `opacity .7s ease ${delay + 150}ms`;
        el.style.opacity = target;
      });
      // ---- daftar Nama RO/BO (slide peringkat & detail): tiap baris muncul berurutan (fade + geser naik) ----
      slideEl.querySelectorAll('.anim-row').forEach((row, k) => {
        const delay = Math.min(k * 22, 460);
        row.style.transition = 'none';
        row.style.opacity = '0'; row.style.transform = 'translateY(8px)';
        void row.getBoundingClientRect();
        row.style.transition = `opacity .42s ease ${delay}ms, transform .5s cubic-bezier(.22,.61,.36,1) ${delay}ms`;
        row.style.opacity = '1'; row.style.transform = 'translateY(0)';
      });
    }
    function render() {
      slideEls.forEach((s, i) => s.classList.toggle('active', i === cur));
      dots.forEach((d, i) => d.classList.toggle('on', i === cur));
      statusTxt.textContent = `${cur + 1} / ${slideEls.length} · ${slideEls[cur].dataset.name}`;
      animateReveal(slideEls[cur]);
      // saat mendarat di slide Monitoring: segarkan datanya (dibatasi maks 1x / 30 dtk)
      if (slideEls[cur] && slideEls[cur].dataset.name === 'Monitoring' && authOn() && (Date.now() - monLastFetch > 30000)) refreshMon();
    }
    function go(i) { cur = (i + slideEls.length) % slideEls.length; elapsed = 0; prog.style.width = '0'; render(); }
    function next() { go(cur + 1) } function prev() { go(cur - 1) }

    setInterval(() => { if (!playing) return; elapsed += TICK; prog.style.width = (elapsed / DUR * 100) + '%'; if (elapsed >= DUR) next(); }, TICK);
    function setPlay(p) { playing = p; document.getElementById('playBtn').textContent = p ? '❚❚' : '▶'; badge.classList.toggle('show', !p); }

       untuk perlindungan berbasis login sungguhan, gunakan versi SharePoint/Entra ID. */
    const GS_CONFIG = {
      spreadsheetId: '1FJs1V0uhfoVXeV33dDw1ZaqDd1e7ZWIVVmm4RmRP62U' // Struktur_Data_Dashboard_Subrogasi_2026_V4 (Google Sheets asli)

    /* ============================================================================
       MODE TERPROTEKSI (login username/password via Google Apps Script).
       Isi AUTH_CONFIG.appsScriptUrl dengan URL Web App (.../exec) hasil deploy

    const AUTH_CONFIG = {
      appsScriptUrl: 'https://script.google.com/macros/s/AKfycbyc01TuwRyKHInlwImhg-gQgIU01ayVfrFZM-mEfYuRMklmBeNDn4jxWG4u0SD1Y1eJsw/exec'
    };
    const authOn = () => /^https:\/\/script\.google\.com\/.+\/exec\b/.test(AUTH_CONFIG.appsScriptUrl || '');
    let authUser = null, authTokMem = '';
    let MON = null, monLastFetch = 0;   // data monitoring (aksi 'monitor'), untuk slide Monitoring
    let PREFETCH_DATA = null;           // data sheet yang IKUT di respons login (hemat 1 panggilan)
    async function fetchMon() {
      if (!authOn() || !getToken()) { MON = null; return; }
      try { const j = await asCall({ action: 'monitor', token: getToken() }); MON = (j && j.ok) ? j : { ok: false, error: j && j.error }; }
      catch (e) { MON = { ok: false }; }
      monLastFetch = Date.now();
    }
    // segarkan MON lalu perbarui isi slide Monitoring di tempat (tanpa buildAll ulang)
    async function refreshMon() {
      const prevOk = !!(MON && MON.ok);
      await fetchMon();
      const el = document.getElementById('monBody');
      if (el && MON && MON.ok) el.innerHTML = monBodyHTML();
      else if (prevOk !== !!(MON && MON.ok)) { buildAll(); } // status akses berubah -> susun ulang slide
    }
    function setToken(t) { authTokMem = t || ''; try { t ? sessionStorage.setItem('subro_tok', t) : sessionStorage.removeItem('subro_tok'); } catch (e) { } }
    function getToken() { try { return sessionStorage.getItem('subro_tok') || authTokMem; } catch (e) { return authTokMem; } }
    // Panggil Apps Script: POST body string (Content-Type text/plain -> "simple request", tanpa preflight CORS)
    // timeoutMs: batas waktu tunggu; bila server tak merespons dalam waktu ini, dibatalkan agar UI tak "menggantung".
    async function asCall(payload, timeoutMs) {
      const tmo = timeoutMs || 90000; // default 90 dtk (login/data bawa seluruh isi sheet -> beri kelonggaran)
      const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
      let timer = null;
      if (ctrl) timer = setTimeout(() => { try { ctrl.abort(); } catch (e) { } }, tmo);
      let res;
      try {
        res = await fetch(AUTH_CONFIG.appsScriptUrl, {
          method: 'POST', redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: ctrl ? ctrl.signal : undefined
        });
      } catch (e) {
        if (ctrl && ctrl.signal && ctrl.signal.aborted) {
          throw new Error('Server terlalu lama merespons (> ' + Math.round(tmo / 1000) + ' dtk). Kemungkinan data di Sheet terlalu besar atau ada baris/kolom kosong yang memperlebar rentang. Coba lagi, dan periksa sheet Fact_Target (lihat langkah perbaikan).');
        }
        throw new Error('Tidak dapat menghubungi server. Periksa koneksi internet & URL Web App.');
      } finally {
        if (timer) clearTimeout(timer);
      }
      const txt = await res.text();
      let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('Respons server tidak valid. Pastikan URL Web App benar (jika Apps Script kehabisan waktu, biasanya balasannya berupa halaman HTML, bukan JSON).'); }
      return j;
    }
    async function doLogin(username, password) {
      const j = await asCall({ action: 'login', username: username, password: password });
      if (!j || !j.ok) throw new Error((j && j.error) || 'Login gagal');
      setToken(j.token); authUser = { name: j.name, role: j.role, unit: j.unit || '', username: username };
      if (j.data) PREFETCH_DATA = j.data; // data sheet ikut di respons login -> dashboard tampil tanpa panggilan kedua
      return j;
    }
    function showLogin(msg) {

    }
    function hideLogin() { const ov = document.getElementById('loginOverlay'); if (ov) ov.style.display = 'none'; }
    function doLogout() {

    // heartbeat "online": kirim ping tiap ±3 menit selama tab terlihat & sudah login
    let pingTimer = null;
    function startPing() {

        if (document.visibilityState && document.visibilityState !== 'visible') return;
        const t = getToken(); if (!t) return;
        asCall({ action: 'ping', token: t }).catch(() => { });
      };

    function gsStatus(msg) { const el = document.getElementById('gsStatus'); if (el) el.textContent = msg || ''; }
    /* parser CSV kecil dengan dukungan tanda kutip (nilai berkoma/berbaris) */
    function parseCsv(text) {
      const rows = []; let row = [], cur = '', q = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (q) {
          if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
          else cur += ch;
        } else if (ch === '"') q = true;
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
        else if (ch !== '\r') cur += ch;
      }
      if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }
    /* CSV gviz mengekspor angka SESUAI FORMAT TAMPILAN sel — "1,198,950,008" (gaya AS)
       atau "1.198.950.008" (gaya Indonesia). Normalisasi keduanya menjadi angka murni. */
    function gsNum(v) {
      if (v === '' || v === undefined) return '';
      if (/^-?\d+(\.\d+)?$/.test(v)) return parseFloat(v);                       // 1234567.89
      if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(v)) return parseFloat(v.replace(/,/g, ''));            // 1,234,567.89
      if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(v)) return parseFloat(v.replace(/\./g, '').replace(',', '.')); // 1.234.567,89
      return v; // teks biasa (kode, nama)
    }
    /* bangun baris objek dari tabel gviz — memberi NILAI MENTAH (v) terlepas dari format sel */
    function gsRowsFromTable(obj) {
      if (!obj || obj.status === 'error' || !obj.table) return null;
      let hdr = (obj.table.cols || []).map(c => ('' + (c.label || '')).trim());
      let rows = obj.table.rows || [];
      if (hdr.every(h => h === '') && rows.length) { // header tidak terbaca sebagai label -> pakai baris pertama
        hdr = rows[0].c.map(c => (c && c.v !== null && c.v !== undefined) ? String(c.v).trim() : '');
        rows = rows.slice(1);
      }
      const out = [];
      for (const r of rows) {
        if (!r || !r.c) continue;
        const o = {};
        let has = false;
        for (let c = 0; c < hdr.length; c++) {
          const cell = r.c[c];
          let v = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : 0;
          if (v !== 0 && v !== '') has = true;
          o[hdr[c] || ('__EMPTY_' + c)] = v;
        }
        if (has) out.push(o);
      }
      return out;
    }
    function gsParseGvizJson(text) {
      const a = text.indexOf('setResponse(');
      const b = text.lastIndexOf(')');
      if (a < 0 || b < a) return null;
      let obj;
      try { obj = JSON.parse(text.substring(a + 'setResponse('.length, b)); } catch (e) { return null; }
      return gsRowsFromTable(obj);
    }
    /* JALUR UTAMA: JSONP via tag <script> — TIDAK tunduk pada CORS, sehingga bekerja bahkan
       ketika respons Google tidak menyertakan header izin lintas-situs (penyebab galat
       "Failed to fetch" pada fetch biasa). Pola resmi gviz: tqx=responseHandler:namaCallback. */
    let gsCbSeq = 0;
    function gsJsonp(name) {
      return new Promise((resolve, reject) => {
        const cb = 'gsCb_' + (++gsCbSeq);
        const s = document.createElement('script');
        const tm = setTimeout(() => { cleanup(); reject(new Error('waktu habis')); }, 15000);
        function cleanup() { clearTimeout(tm); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
        window[cb] = obj => {
          const rows = gsRowsFromTable(obj);
          cleanup();
          if (rows && rows.length) resolve(rows); else reject(new Error('sheet kosong/tidak terbaca'));
        };
        s.onerror = () => { cleanup(); reject(new Error('script tidak termuat')); };
        s.src = 'https://docs.google.com/spreadsheets/d/' + GS_CONFIG.spreadsheetId +
          '/gviz/tq?headers=1&sheet=' + encodeURIComponent(name) + '&tqx=out:json;responseHandler:' + cb;
        document.head.appendChild(s);
      });
    }
    async function gsSheetRows(name, required) {
      const base = 'https://docs.google.com/spreadsheets/d/' + GS_CONFIG.spreadsheetId +
        '/gviz/tq?headers=1&sheet=' + encodeURIComponent(name) + '&tqx=out:';
      // 1) JSONP via <script> — kebal CORS (jalur paling andal di browser)
      try {
        const rows = await gsJsonp(name);
        if (rows && rows.length) return rows;
      } catch (e) { /* lanjut ke fetch */ }
      // 2) fetch JSON (nilai mentah) — bila CORS tersedia
      try {
        const rj = await fetch(base + 'json');
        if (rj.ok) {
          const rows = gsParseGvizJson(await rj.text());
          if (rows && rows.length) return rows;
        }
      } catch (e) { /* lanjut ke CSV */ }
      // 2) cadangan: CSV + normalisasi angka berformat
      const resp = await fetch(base + 'csv');
      if (!resp.ok) {
        if (required) throw new Error('sheet "' + name + '" tidak bisa diambil (' + resp.status + ') — pastikan spreadsheet dibagikan "Anyone with the link: Viewer"');
        return null;
      }
      const text = await resp.text();
      if (/^\s*</.test(text)) {
        if (required) throw new Error('sheet "' + name + '" tidak dapat dibaca — spreadsheet belum dibagikan "Anyone with the link"');
        return null;
      }
      const grid = parseCsv(text);
      if (!grid.length) return required ? (() => { throw new Error('sheet "' + name + '" kosong'); })() : null;
      const hdr = grid[0].map(h => ('' + h).trim());
      const out = [];
      for (let i = 1; i < grid.length; i++) {
        const r = grid[i];
        if (!r.some(v => v !== '' && v !== undefined)) continue;
        const o = {};
        for (let c = 0; c < hdr.length; c++) {
          const v = gsNum(r[c] === undefined ? '' : r[c]);
          o[hdr[c] || ('__EMPTY_' + c)] = v === '' ? 0 : v;
        }
        out.push(o);
      }
      return out;
    }
    // ambil semua sheet + hitung D. Dipakai bersama oleh muat awal & auto-refresh.
    async function gsFetchCompute() {
      const cleanDim = rows => rows.filter(r => typeof r.BO_Code === 'string' && r.BO_Code.trim() !== '');
      const cleanFact = rows => rows.filter(r => typeof r.Produk_Code === 'string' && r.Produk_Code.trim() !== '' && +r.Bulan >= 1 && +r.Bulan <= 12);
      const cleanVisit = rows => rows.filter(r => typeof r.BO_Code === 'string' && r.BO_Code.trim() !== '');
      let cabR, ftR, frR, frLYr, fkbR, fkbLYr, visitR, angRr;
      if (authOn()) {
        // MODE TERPROTEKSI: pakai data yang sudah IKUT di respons login bila ada (tanpa panggilan ke-2);
        // selain itu (mis. auto-refresh) baru panggil aksi 'data' dengan token.
        let dt;
        if (PREFETCH_DATA) { dt = PREFETCH_DATA; PREFETCH_DATA = null; }
        else {
          const j = await asCall({ action: 'data', token: getToken() });
          if (!j || !j.ok) { const err = new Error((j && j.error) || 'Sesi tidak valid'); err.auth = true; throw err; }
          dt = j.data || {};
        }
        cabR = dt.Dim_Cabang || []; ftR = dt.Fact_Target || []; frR = dt.Fact_Realisasi || [];
        frLYr = dt.Fact_Realisasi_LY || null; fkbR = dt.Fact_KUR_Bank || null;
        fkbLYr = dt.Fact_KUR_Bank_LY || null; visitR = dt.Fact_Kinerja_Cabang || null;
        angRr = dt.Fact_Anggaran_BO || null;
      } else {
        [cabR, ftR, frR, frLYr, fkbR, fkbLYr, visitR, angRr] = await Promise.all([
          gsSheetRows('Dim_Cabang', true),
          gsSheetRows('Fact_Target', true),
          gsSheetRows('Fact_Realisasi', true),
          gsSheetRows('Fact_Realisasi_LY', false),
          gsSheetRows('Fact_KUR_Bank', false),
          gsSheetRows('Fact_KUR_Bank_LY', false),
          gsSheetRows('Fact_Kinerja_Cabang', false),
          gsSheetRows('Fact_Anggaran_BO', false)
        ]);
      }
      const cab = cleanDim(cabR), ft = cleanFact(ftR), fr = cleanFact(frR);
      const frLY = frLYr ? cleanFact(frLYr) : null;
      const fkb = fkbR ? cleanFact(fkbR) : null;
      const fkbLY = fkbLYr ? cleanFact(fkbLYr) : null;
      const visits = visitR ? cleanVisit(visitR) : null;
      const ang = angRr ? cleanVisit(angRr) : null;
      const nd = computeD(ft, fr, cab, undefined, frLY, fkb, fkbLY, visits, ang);
      // GUARD: tolak payload KOSONG / tidak lengkap (mis. auto-refresh yang gagal sebagian dari server).
      // Tanpa ini, data nol/undefined akan menimpa data yang sedang tampil (semua jadi 0.0% & "undefined").
      // Dengan melempar error di sini, pemanggil (gsRefresh) akan MEMPERTAHANKAN data terakhir yang valid.
      const _lm = nd && nd.meta && nd.meta.latest_month_num;
      if (!fr.length || !cab.length || !(_lm >= 1 && _lm <= 12)) {
        const err = new Error('Data dari server kosong/tidak lengkap saat pembaruan');
        err.empty = true;
        throw err;
      }
      const periods = Array.from({ length: nd.meta.max_month }, (_, i) => i + 1).map(m => ({
        key: 'm' + m, label: 'Data s.d. ' + MONTH_FULL[m - 1] + ' ' + nd.meta.year, month: m
      }));
      return { nd, periods, raw: { ft, fr, cab, frLY, fkb, fkbLY, visits, ang } };
    }
    // muat awal (dengan status & pindah ke slide 0)
    async function gsLoad() {
      const btn = document.getElementById('gsBtn');
      if (btn) { btn.disabled = true; }
      gsStatus(authOn() ? 'Memuat data…' : 'Mengambil data dari Google Sheets…');
      try {
        const { nd, periods, raw } = await gsFetchCompute();
        RAWROWS = raw; PERIODS = periods; D = nd;
        if (authOn()) {
          hideLogin();
          const lo = document.getElementById('logoutBtn'); if (lo) lo.style.display = 'inline-flex';
          const ut = document.getElementById('userTag'); if (ut && authUser) { ut.style.display = 'inline'; ut.textContent = authUser.name || authUser.username || ''; }
          startPing(); // mulai heartbeat status online
        }
        buildAll(); go(0); // TAMPILKAN dashboard sekarang (tanpa menunggu data monitoring)
        const extras = [nd.ytd.kur.yoy != null ? 'YoY aktif' : null, (nd.produk_kur_banks && nd.produk_kur_banks.length) ? 'per-bank aktif' : null].filter(Boolean).join(', ');
        toast('Data ' + D.meta.latest_month + ' ' + D.meta.year + ' dimuat · ' + D.meta.n_bo + ' branch' + (extras ? ' · ' + extras : ''), 'ok');
        gsStartAutoRefresh();
        // data monitoring dimuat di LATAR; slide Monitoring ditambahkan begitu siap (tak menunda dashboard)
        if (authOn()) fetchMon().then(() => { if (MON && MON.ok) buildAll(); }).catch(() => { });
      } catch (e) {
        if (authOn()) { showLogin(e && e.auth ? 'Sesi berakhir. Silakan login ulang.' : ('Gagal memuat data: ' + (e ? e.message : ''))); return; }
        gsStatus('Gagal: ' + e.message);
        if (btn) btn.disabled = false;
      }
    }
    // auto-refresh SENYAP: tarik ulang data & bangun ulang TANPA memindah slide (pertahankan
    // posisi & zoom peta). Dilewati saat slideshow di-pause (ada yang sedang berinteraksi/hover).
    async function gsRefresh() {
      if (!D) return;
      if (!authOn() && !gsReady()) return;
      if (!playing) return; // jangan ganggu bila sedang dilihat/diinteraksi (hover mem-pause)
      const prevMonth = D.meta.latest_month_num, prevReal = D.ytd.gab.real;
      // Coba beberapa kali; D HANYA ditimpa bila data baru VALID (gsFetchCompute melempar error bila kosong),
      // sehingga pembaruan yang gagal tidak pernah menghapus angka yang sedang tampil di layar.
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const { nd, periods, raw } = await gsFetchCompute();
          RAWROWS = raw; PERIODS = periods; D = nd;   // commit hanya setelah lolos guard (data valid)
          if (authOn()) await fetchMon();
          buildAll(); // 'cur' (slide aktif) dipertahankan; tidak go(0)
          if (nd.meta.latest_month_num !== prevMonth || nd.ytd.gab.real !== prevReal) {
            toast('Data diperbarui · s.d. ' + nd.meta.latest_month + ' ' + nd.meta.year, 'ok');
          }
          return; // sukses
        } catch (e) {
          // sesi kadaluarsa -> minta login ulang, hentikan percobaan
          if (authOn() && e && e.auth) { doLogout(); return; }
          // kosong/transien -> tunggu sebentar lalu coba lagi; data lama tetap tampil
          try { console.warn('Pembaruan data gagal (percobaan ' + attempt + '/3): ' + (e && e.message)); } catch (_) { }
          if (attempt < 3) { await new Promise(r => setTimeout(r, 15000)); }
        }
      }
      // ketiga percobaan gagal: sengaja TIDAK mengubah D — layar tetap menampilkan data terakhir yang valid.
    }
    let gsTimer = null;
    function gsStartAutoRefresh() {
      if (gsTimer) return;
      gsTimer = setInterval(gsRefresh, 15 * 60 * 1000); // 15 menit
    }
    // ---- wiring form login & tombol keluar ----
    (function authWire() {
      const form = document.getElementById('loginForm');
      if (form) form.addEventListener('submit', async ev => {
        ev.preventDefault();
        const u = (document.getElementById('loginUser').value || '').trim();
        const p = document.getElementById('loginPass').value || '';
        const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
        if (!u || !p) { if (err) err.textContent = 'Username & password wajib diisi.'; return; }
        if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; }
        if (err) err.textContent = '';
        try {
          await doLogin(u, p);         // validasi kredensial di server (throw bila salah)
        } catch (e) {
          if (btn) { btn.disabled = false; btn.textContent = 'Masuk'; }
          if (err) err.textContent = e && e.message ? e.message : 'Login gagal.';
          return;
        }
        if (btn) { btn.textContent = 'Masuk'; }
        gsLoad();                      // tarik data pakai token; sembunyikan login bila sukses
      });
      const lo = document.getElementById('logoutBtn');
      if (lo) lo.addEventListener('click', doLogout);
    })();
    (function gsInit() {
      setTimeout(() => {
        // MODE TERPROTEKSI: tampilkan layar login lebih dulu; data hanya dimuat setelah login sukses
        if (authOn()) { showLogin(''); return; }
        // MODE PUBLIK (lama): muat otomatis dari Google Sheets publik
        const btn = document.getElementById('gsBtn');
        if (!btn) return;
        if (gsReady()) { btn.style.display = 'flex'; gsLoad(); /* langsung coba muat otomatis */ }
        else gsStatus('Belum dikonfigurasi: isi GS_CONFIG.spreadsheetId di dalam file ini (petunjuk lengkap ada di komentar kode, ±5 menit).');
      }, 80);
    })();


  </script>
